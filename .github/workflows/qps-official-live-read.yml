name: QPS Official MCP Live Read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OFFICIAL_SHA: 7d13a7ad6f2a17f351a6d77ce280c85ae1821f4d
      GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
    steps:
      - name: Probe identity
        run: |
          echo "QPS_MISSION=M03_GITHUB_MCP_SERVER"
          echo "QPS_PULSE=P_M03_OFFICIAL_LIVE_READ_02"
          echo "CARRIER_SHA=${GITHUB_SHA}"
          echo "OFFICIAL_SHA=${OFFICIAL_SHA}"
          echo "RUNNER_NAME=${RUNNER_NAME}"

      - name: Checkout official exact source
        uses: actions/checkout@v4
        with:
          repository: github/github-mcp-server
          ref: ${{ env.OFFICIAL_SHA }}
          path: official
          fetch-depth: 1

      - name: Set up Go from official source
        uses: actions/setup-go@v5
        with:
          go-version-file: official/go.mod
          cache: false

      - name: Build official server and mcpcurl
        working-directory: official
        run: |
          go build -o "$RUNNER_TEMP/github-mcp-server" ./cmd/github-mcp-server
          go build -o "$RUNNER_TEMP/mcpcurl" ./cmd/mcpcurl
          "$RUNNER_TEMP/github-mcp-server" --help >/dev/null
          "$RUNNER_TEMP/mcpcurl" --help >/dev/null

      - name: Prove repos tool discovery
        working-directory: official
        run: |
          set -euo pipefail
          SERVER_CMD="$RUNNER_TEMP/github-mcp-server stdio --toolsets=repos"
          "$RUNNER_TEMP/mcpcurl" \
            --stdio-server-cmd "$SERVER_CMD" \
            tools --help \
            | tee "$RUNNER_TEMP/m03-tools-help.txt"
          grep -q "get_file_contents" "$RUNNER_TEMP/m03-tools-help.txt"
          "$RUNNER_TEMP/mcpcurl" \
            --stdio-server-cmd "$SERVER_CMD" \
            tools get_file_contents --help \
            | tee "$RUNNER_TEMP/m03-get-file-help.txt"
          grep -q -- "--owner" "$RUNNER_TEMP/m03-get-file-help.txt"
          grep -q -- "--repo" "$RUNNER_TEMP/m03-get-file-help.txt"
          grep -q -- "--sha" "$RUNNER_TEMP/m03-get-file-help.txt"

      - name: Execute and validate real read-only GitHub MCP operation
        id: live_read
        working-directory: official
        run: |
          set -euo pipefail
          SERVER_CMD="$RUNNER_TEMP/github-mcp-server stdio --toolsets=repos"
          RESPONSE="$GITHUB_WORKSPACE/m03_live_read_response.json"
          "$RUNNER_TEMP/mcpcurl" \
            --pretty=false \
            --stdio-server-cmd "$SERVER_CMD" \
            tools get_file_contents \
            --owner github \
            --repo github-mcp-server \
            --path README.md \
            --sha "$OFFICIAL_SHA" \
            > "$RESPONSE"
          test -s "$RESPONSE"
          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESPONSE"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          if "error" in payload:
              raise SystemExit(f"MCP JSON-RPC error: {payload['error']}")
          result = payload.get("result") or {}
          if result.get("isError") is True:
              raise SystemExit("MCP tool result isError=true")
          content = result.get("content") or []
          if not content:
              raise SystemExit("MCP response contained no content items")

          diagnostics = []
          success_messages = []
          embedded_texts = []
          for item in content:
              item_type = item.get("type", "")
              if item_type == "text":
                  text = item.get("text", "")
                  success_messages.append(text)
                  diagnostics.append({"type": "text", "length": len(text), "prefix": text[:160]})
              elif item_type == "resource":
                  resource = item.get("resource") or {}
                  text = resource.get("text", "")
                  embedded_texts.append(text)
                  diagnostics.append({
                      "type": "resource",
                      "uri": resource.get("uri"),
                      "mimeType": resource.get("mimeType"),
                      "length": len(text),
                      "prefix": text[:160],
                  })
              else:
                  diagnostics.append({"type": item_type, "keys": sorted(item.keys())})

          print("QPS_M03_RESPONSE_DIAGNOSTIC=" + json.dumps({
              "result_keys": sorted(result.keys()),
              "content": diagnostics,
              "response_bytes": path.stat().st_size,
          }, sort_keys=True))

          if not any("successfully downloaded" in text.lower() for text in success_messages):
              raise SystemExit("get_file_contents did not return a success message")
          if not embedded_texts or not any(text.strip() for text in embedded_texts):
              raise SystemExit("get_file_contents returned no non-empty embedded file resource")
          readme = "\n".join(embedded_texts).lower()
          if "github mcp server" not in readme:
              raise SystemExit("embedded README resource did not contain expected title")
          print(f"validated_content_items={len(content)} embedded_resources={len(embedded_texts)}")
          PY
          echo "response_path=$RESPONSE" >> "$GITHUB_OUTPUT"

      - name: Upload raw public MCP response diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-official-live-read-response
          path: m03_live_read_response.json
          if-no-files-found: warn

      - name: Emit exact-source QPS operation receipt
        env:
          RESPONSE_PATH: ${{ steps.live_read.outputs.response_path }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          response = Path(os.environ["RESPONSE_PATH"]).read_bytes()
          receipt = {
              "mission_id": "M03_GITHUB_MCP_SERVER",
              "pulse_id": "P_M03_OFFICIAL_LIVE_READ_02",
              "carrier_repo": os.environ["GITHUB_REPOSITORY"],
              "carrier_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "official_repo": "github/github-mcp-server",
              "official_source_sha": os.environ["OFFICIAL_SHA"],
              "operation": "get_file_contents",
              "target": "github/github-mcp-server:README.md",
              "target_sha": os.environ["OFFICIAL_SHA"],
              "toolset": "repos",
              "transport": "official_github_mcp_server_stdio_via_mcpcurl",
              "response_sha256": hashlib.sha256(response).hexdigest(),
              "executed_steps_claim": ">0",
              "result": "PASS",
              "authority": "REAL_READ_ONLY_OPERATION_NOT_YET_FULL_QPS_TRANSPORT_EQUIVALENCE",
          }
          out = Path("m03_official_live_read_receipt.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload M03 live-operation receipt
        uses: actions/upload-artifact@v4
        with:
          name: m03-official-live-read-receipt
          path: m03_official_live_read_receipt.json
          if-no-files-found: error
